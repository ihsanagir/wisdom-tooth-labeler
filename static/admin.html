<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Admin — Görüntü Yükleme</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 580px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.4rem; color: #63b3ed; }
    p.sub { color: #718096; font-size: 0.9rem; margin-bottom: 2rem; }
    label { display: block; font-size: 0.85rem; color: #a0aec0; margin-bottom: 0.4rem; }
    input[type="password"], input[type="file"] {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: #e2e8f0;
      font-size: 0.95rem;
      margin-bottom: 1.2rem;
    }
    input[type="file"] { cursor: pointer; }
    button {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, #4299e1, #3182ce);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .progress {
      margin-top: 1.5rem;
      display: none;
    }
    .progress-bar-wrap {
      background: #2d3748;
      border-radius: 99px;
      height: 8px;
      overflow: hidden;
      margin-bottom: 0.6rem;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #4299e1, #68d391);
      width: 0%;
      transition: width 0.3s;
      border-radius: 99px;
    }
    .status { font-size: 0.85rem; color: #a0aec0; }
    .result {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }
    .result.success { background: #1a3a2a; border: 1px solid #38a169; color: #68d391; }
    .result.error { background: #3a1a1a; border: 1px solid #e53e3e; color: #fc8181; }
    .count-badge {
      display: inline-block;
      background: #2d3748;
      border-radius: 6px;
      padding: 0.3rem 0.8rem;
      font-size: 0.85rem;
      margin-top: 1rem;
      color: #63b3ed;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🦷 Admin Paneli</h1>
    <p class="sub">Etiketleme için görüntüleri Railway sunucusuna yükle</p>

    <label>Admin Şifresi</label>
    <input type="password" id="token" placeholder="wisdom2024admin" />

    <label>Görüntüler (JPG/PNG — toplu seçim yapabilirsin)</label>
    <input type="file" id="files" multiple accept=".jpg,.jpeg,.png" />

    <div id="selectedInfo" class="count-badge" style="display:none;margin-bottom:1.2rem;"></div>

    <button id="uploadBtn" onclick="uploadImages()">Yükle</button>

    <div class="progress" id="progress">
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="status" id="statusText">Yükleniyor...</div>
    </div>

    <div class="result" id="result"></div>

    <hr style="border: 0; border-top: 1px solid #2d3748; margin: 2rem 0 1.5rem 0;">

    <h2 style="font-size: 1.1rem; color: #68d391; margin-bottom: 0.4rem;">📦 Veri Setini İndir</h2>
    <p class="sub" style="margin-bottom: 1rem;">Etiketlenmiş tüm görselleri ve YOLO formatındaki etiket dosyalarını (.txt) ZIP paketi olarak indir.</p>
    <a href="/api/label/export" download style="display: block; text-align: center; text-decoration: none; padding: 0.85rem; background: linear-gradient(135deg, #38a169, #276749); border-radius: 8px; color: white; font-weight: 600; font-size: 0.95rem; transition: opacity 0.2s;">
      📥 YOLO Dataset İndir (ZIP)
    </a>
  </div>

  <script>
    document.getElementById('files').addEventListener('change', function() {
      const n = this.files.length;
      const info = document.getElementById('selectedInfo');
      if (n > 0) {
        info.style.display = 'inline-block';
        info.textContent = `${n} görüntü seçildi`;
      } else {
        info.style.display = 'none';
      }
    });

    async function uploadImages() {
      const token = document.getElementById('token').value.trim();
      const filesInput = document.getElementById('files');
      const files = filesInput.files;
      const btn = document.getElementById('uploadBtn');
      const progressEl = document.getElementById('progress');
      const progressBar = document.getElementById('progressBar');
      const statusText = document.getElementById('statusText');
      const resultEl = document.getElementById('result');

      if (!token) { alert('Şifreyi gir!'); return; }
      if (files.length === 0) { alert('Görüntü seç!'); return; }

      btn.disabled = true;
      progressEl.style.display = 'block';
      resultEl.style.display = 'none';

      const BATCH = 20; // Her seferinde 20 görüntü gönder
      let totalSaved = 0;
      let totalErrors = [];

      for (let i = 0; i < files.length; i += BATCH) {
        const batch = Array.from(files).slice(i, i + BATCH);
        const formData = new FormData();
        batch.forEach(f => formData.append('files', f));

        try {
          const resp = await fetch(`/api/admin/upload?token=${encodeURIComponent(token)}`, {
            method: 'POST',
            body: formData,
          });
          const data = await resp.json();
          if (resp.ok) {
            totalSaved += data.saved;
            totalErrors = totalErrors.concat(data.errors || []);
          } else {
            resultEl.className = 'result error';
            resultEl.style.display = 'block';
            resultEl.textContent = data.error || 'Hata oluştu.';
            btn.disabled = false;
            return;
          }
        } catch (e) {
          resultEl.className = 'result error';
          resultEl.style.display = 'block';
          resultEl.textContent = 'Bağlantı hatası: ' + e.message;
          btn.disabled = false;
          return;
        }

        const pct = Math.round(((i + batch.length) / files.length) * 100);
        progressBar.style.width = pct + '%';
        statusText.textContent = `${Math.min(i + BATCH, files.length)} / ${files.length} görüntü yüklendi...`;
      }

      btn.disabled = false;
      progressBar.style.width = '100%';
      statusText.textContent = 'Tamamlandı!';

      resultEl.className = 'result success';
      resultEl.style.display = 'block';
      resultEl.innerHTML = `✅ ${totalSaved} görüntü başarıyla yüklendi!` +
        (totalErrors.length ? `<br>⚠️ ${totalErrors.length} hata: ${totalErrors.join(', ')}` : '') +
        `<br><br><a href="/label" style="color:#68d391">→ Label sayfasına git</a>`;
    }
  </script>
</body>
</html>
